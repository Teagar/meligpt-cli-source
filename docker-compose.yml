version: "3.8"                                                                                                     
                                                                                                                     
services:                                                                                                    
  meligpt:
    build:
      context: .
    image: meligpt-cli:local
    restart: unless-stopped
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./data/config:/data/config
      - ./data/files:/data/files
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
networks:
  internal:
